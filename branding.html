<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Program branding downloads</title>
  <link rel="stylesheet" href="landing.css">
  <style>
    .brand-preview{max-width:100%;width:780px;margin:2rem 0;padding:24px;background:#fff;border:1px solid #ddd}
    .brand-preview img{display:block;width:100%;height:auto}
  </style>

<body>
  <main>
    <p><a href="index.html">← Promotional materials</a></p>
    <h1>Program branding</h1>
    <p>EU and Global Affairs Study Abroad Program · Georgia Tech</p>
    <div class="brand-preview"><img src="assets/branding/program-wordmark.svg" alt="EU and Global Affairs Study Abroad Program wordmark"></div>
    <div class="buttons">
      <a href="assets/branding/program-wordmark.svg" download="program-wordmark.svg">Download vector SVG</a>
      <a href="downloads/program-wordmark.png" download>Download transparent PNG</a>

    <p class="note">The SVG is the single source used by the flyer and presentation. The PNG is a 1560 × 224 px export for use outside this repository.</p>
  </main>
