<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Georgia Tech EU and Global Affairs Study Abroad hallway TV banner.">
  <title>EU + Global Affairs | Hallway TV Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;800&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hallway.css">
</head>
<body>
  <main class="tv-banner">
    <div class="tv-photo"><img src="photos/paris/city-01.jpg" alt="The Eiffel Tower and Seine in Paris at dusk"></div>
    <a class="tv-photo-credit" href="https://commons.wikimedia.org/wiki/File:Eiffel_Tower_and_Pont_Alexandre_III_at_night.jpg" target="_blank" rel="noreferrer">Photo: Getfunky Paris · CC BY 2.0</a>
    <div class="tv-content">
      <div class="tv-wordmark"><img src="assets/branding/program-wordmark.svg" alt="EU and Global Affairs Study Abroad Program"></div>
      <div class="tv-message">
        <p class="tv-term">Georgia Tech · Summer 2027</p>
        <h1><span>Let Europe be</span><span>your laboratory</span></h1>
        <p class="tv-subline">Study global affairs where they happen.</p>
      </div>
      <div class="tv-action">
        <a href="https://inta.gatech.edu/europeglobal" aria-label="Open the program website"><img src="assets/program-website-europeglobal-qr.png" alt="QR code linking to the program website"></a>
        <div><strong>Scan to explore the program</strong><span>inta.gatech.edu/europeglobal</span></div>
      </div>
    </div>
  </main>
</body>
</html>
