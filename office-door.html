<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Half-page Georgia Tech EU and Global Affairs Study Abroad office-door printout.">
  <title>EU + Global Affairs | Office-Door Printout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;800&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="office-door.css">
</head>
<body>
  <div class="preview-tools"><button type="button" onclick="window.print()">Print at 5.5 × 8.5 in</button></div>
  <main class="door-page">
    <header class="door-header"><img src="assets/branding/program-wordmark.svg" alt="EU and Global Affairs Study Abroad Program"></header>
    <section class="door-message">
      <p class="door-term">Summer 2027</p>
      <h1><span>Let Europe be</span><span>your laboratory</span></h1>
      <p>Study global affairs where they happen. Visit the cities and institutions shaping Europe and the world.</p>
    </section>
    <section class="door-apply" aria-label="Program website">
      <a href="https://inta.gatech.edu/europeglobal"><img src="assets/program-website-europeglobal-qr.png" alt="QR code linking to the program website"></a>
      <div><strong>Scan to explore the program</strong><span>inta.gatech.edu/europeglobal</span></div>
    </section>
    <footer class="door-footer"><img src="assets/Nunnlogo.jpg" alt="Georgia Tech, Sam Nunn School of International Affairs"></footer>
  </main>
</body>
</html>
