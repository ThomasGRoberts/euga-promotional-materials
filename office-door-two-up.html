<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EU and Global Affairs | Two-up office-door print sheet</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:11in;height:8.5in;margin:0;background:#fff}
    .sheet{position:relative;display:grid;grid-template-columns:5.5in 5.5in;width:11in;height:8.5in;overflow:hidden}
    .panel{display:flex;align-items:center;justify-content:center;width:5.5in;height:8.5in;overflow:hidden}
    iframe{display:block;flex:none;width:5.5in;height:8.5in;border:0;transform:scale(.94)}
    .sheet::before,.sheet::after{content:"";position:absolute;z-index:2;left:5.5in;width:1px;height:.13in;background:#b6b6b6}
    .sheet::before{top:0}.sheet::after{bottom:0}
    @page{size:11in 8.5in;margin:0}
  </style>
</head>
<body><main class="sheet" aria-label="Two office-door signs on one landscape letter sheet"><div class="panel"><iframe src="office-door.html" title="Left office-door sign"></iframe></div><div class="panel"><iframe src="office-door.html" title="Right office-door sign"></iframe></div></main></body>
</html>
