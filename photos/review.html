<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EUGA banner photo review</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:30px;background:#efefec;color:#161616;font-family:Arial,sans-serif}h1{margin:0 0 24px;color:#051e39;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{overflow:hidden;background:#fff;box-shadow:0 3px 12px #0001}.card img{display:block;width:100%;height:190px;object-fit:cover;background:#ddd}.copy{padding:10px 12px 12px}.city{color:#8f713d;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.name{margin-top:4px;color:#051e39;font-size:14px;font-weight:700}.meta{margin-top:5px;color:#666;font-size:10px;line-height:1.35}
  </style>
</head>
<body>
  <h1>Banner photo library review</h1>
  <main class="grid" id="grid"></main>
  <script>
    fetch('sources.json').then(response=>response.json()).then(records=>{
      document.querySelector('#grid').replaceChildren(...records.map(record=>{
        const card=document.createElement('article');card.className='card';
        const image=document.createElement('img');image.src=`${record.city}/${record.file}`;image.alt=record.description||record.commons_title;
        const copy=document.createElement('div');copy.className='copy';
        const city=document.createElement('div');city.className='city';city.textContent=`${record.city.replaceAll('-',' ')} · ${record.role}`;
        const name=document.createElement('div');name.className='name';name.textContent=record.file;
        const meta=document.createElement('div');meta.className='meta';meta.textContent=`${record.commons_title} · ${record.license}`;
        copy.append(city,name,meta);card.append(image,copy);return card;
      }));
    });
  </script>
</body>
</html>
